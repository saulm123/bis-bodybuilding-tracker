# Runs when you push a version tag like v0.1.0. Builds the signed APK and
# publishes it as a GitHub Release, which is what Obtainium checks for updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          GRADLE=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "tag=$TAG package.json=$PKG build.gradle=$GRADLE"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$GRADLE" ]; then
            echo "::error::Tag, package.json version and build.gradle versionName must all match"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build:foss
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See docs/SIGNING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          BIS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleFossRelease

      - name: Verify signature and prepare files
        run: |
          APK=android/app/build/outputs/apk/foss/release/app-foss-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir out
          cp "$APK" "out/bis-tracker-${GITHUB_REF_NAME}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
