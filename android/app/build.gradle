apply plugin: 'com.android.application'

// Release signing. CI passes the key in through environment variables;
// locally you can create android/keystore.properties (never committed).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'BIS_KEYSTORE_FILE')
def playStoreFile = signingValue('playStoreFile', 'BIS_PLAY_KEYSTORE_FILE')

android {
    namespace = "com.bis.bodybuildingtracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bis.bodybuildingtracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump both for every release. versionCode = major*10000 + minor*100 + patch.
        // F-Droid reads these from this file, so they must live here, not in CI.
        versionCode 802
        versionName "0.8.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // GitHub / F-Droid / IzzyOnDroid key (see docs/SIGNING.md)
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                def storePass = signingValue('storePassword', 'BIS_KEYSTORE_PASSWORD')
                storePassword storePass
                keyAlias signingValue('keyAlias', 'BIS_KEY_ALIAS')
                // Modern (PKCS12) keystores use one password for both, so fall back to it.
                keyPassword signingValue('keyPassword', 'BIS_KEY_PASSWORD') ?: storePass
            }
        }
        // Google Play upload key: a separate key, only used for the Play build (docs/PLAY.md)
        playUpload {
            if (playStoreFile) {
                storeFile file(playStoreFile)
                def playPass = signingValue('playStorePassword', 'BIS_PLAY_KEYSTORE_PASSWORD')
                storePassword playPass
                keyAlias signingValue('playKeyAlias', 'BIS_PLAY_KEY_ALIAS')
                keyPassword playPass
            }
        }
    }

    // foss: GitHub / F-Droid / IzzyOnDroid build with every feature.
    // play: Google Play build without the cycle log (different app ID so the two never clash).
    flavorDimensions = ["store"]
    productFlavors {
        foss {
            dimension "store"
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
        play {
            dimension "store"
            applicationIdSuffix ".play"
            if (playStoreFile) signingConfig signingConfigs.playUpload
        }
    }

    // Keep builds reproducible and free of Google-only metadata (F-Droid requirement).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        release {
            vcsInfo.include false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Reproducible builds (F-Droid): ART baseline profiles aren't byte-for-byte stable
// between machines, so leave them out. They only speed up the first launch slightly.
tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}
